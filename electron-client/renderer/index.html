<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>NO_Flychess</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 页面容器 -->
  <div id="app">
    <!-- 主页 -->
    <div id="page-home" class="page active">
      <div class="home-center">
        <h1 class="title">✈ NO_Flychess</h1>
        <p class="subtitle">卡牌飞行棋 · 局域网联机</p>
        <div class="home-card">
          <div class="form-row">
            <label>服务器地址</label>
            <input type="text" id="server-url" value="ws://localhost:8080" />
          </div>
          <div class="form-row">
            <label>玩家名称</label>
            <input type="text" id="player-name" value="Player" maxlength="12" />
          </div>
          <button class="btn primary" id="btn-connect">连接服务器</button>
          <div class="sep-text">— 或 —</div>
          <button class="btn primary" id="btn-host" style="background:#2ecc71">创建房间（本机 host）</button>
        </div>
        <div class="footer-text">v0.4.0</div>
      </div>
    </div>

    <!-- 大厅 -->
    <div id="page-lobby" class="page">
      <div class="lobby-layout">
        <div class="lobby-left">
          <h2>游戏房间</h2>
          <div id="room-info" class="info-box">
            <p>服务器：<span id="lobby-url"></span></p>
            <p>人数：<span id="lobby-player-count">0/4</span></p>
            <p>每方棋子：<span id="lobby-chess-count">4</span></p>
          </div>
          <div class="config-row">
            <label>玩家人数</label>
            <select id="cfg-player-count">
              <option value="1">1 人</option>
              <option value="2">2 人</option>
              <option value="3">3 人</option>
              <option value="4" selected>4 人</option>
            </select>
          </div>
          <div class="config-row">
            <label>棋子数</label>
            <select id="cfg-chess-count">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4" selected>4</option>
            </select>
          </div>
          <button class="btn primary" id="btn-ready">准备</button>
          <button class="btn primary hidden" id="btn-start">开始游戏</button>
        </div>
        <div class="lobby-right">
          <h3>玩家列表</h3>
          <div id="player-list" class="player-list"></div>
          <h3>聊天</h3>
          <div id="chat-list" class="chat-list"></div>
          <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="输入消息..." maxlength="200" />
            <button class="btn small" id="btn-chat-send">发送</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 游戏 -->
    <div id="page-game" class="page">
      <div class="game-layout">
        <div class="game-board-area">
          <canvas id="chess-canvas" width="680" height="680"></canvas>
          <div class="dice-area">
            <div id="dice-display" class="dice-box">?</div>
            <button class="btn primary" id="btn-roll-dice" disabled>掷骰子</button>
            <button class="btn small" id="btn-finish-card" disabled>结束出牌</button>
          </div>
        </div>
        <div class="game-sidebar">
          <div id="card-hand" class="card-hand">
            <p class="sidebar-hint">暂无卡牌</p>
          </div>
          <div id="game-chat" class="chat-list"></div>
          <div class="chat-input-row">
            <input type="text" id="game-chat-input" placeholder="输入消息..." maxlength="200" />
            <button class="btn small" id="btn-game-chat-send">发送</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 结果弹窗 -->
    <div id="modal-overlay" class="modal-overlay hidden"></div>
    <div id="result-modal" class="modal hidden">
      <h2>游戏结束</h2>
      <div id="ranking-text"></div>
      <button class="btn primary" id="btn-close-modal">回到房间</button>
    </div>
  </div>

  <script src="network/ws.js"></script>
  <script src="components/board.js"></script>
  <script src="components/card.js"></script>
  <script src="components/chat.js"></script>
  <script src="components/dice.js"></script>
  <script src="pages/home.js"></script>
  <script src="pages/lobby.js"></script>
  <script src="pages/game.js"></script>
  <script src="app.js"></script>
</body>
</html>
